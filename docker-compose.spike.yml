services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: verdict_spike
      POSTGRES_USER: verdict
      POSTGRES_PASSWORD: verdict
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdict -d verdict_spike"]
      interval: 2s
      timeout: 2s
      retries: 30

  mysql-repeatable-read:
    image: mysql:8
    environment:
      MYSQL_DATABASE: verdict_spike
      MYSQL_USER: verdict
      MYSQL_PASSWORD: verdict
      MYSQL_ROOT_PASSWORD: root
    command: ["--transaction-isolation=REPEATABLE-READ"]
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 2s
      timeout: 2s
      retries: 30

  mysql-read-committed:
    image: mysql:8
    environment:
      MYSQL_DATABASE: verdict_spike
      MYSQL_USER: verdict
      MYSQL_PASSWORD: verdict
      MYSQL_ROOT_PASSWORD: root
    command: ["--transaction-isolation=READ-COMMITTED"]
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 2s
      timeout: 2s
      retries: 30

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: verdict_spike
      MARIADB_USER: verdict
      MARIADB_PASSWORD: verdict
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 2s
      retries: 30
