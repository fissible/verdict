name: Scorecard supply-chain security

# OpenSSF Scorecard (#254, item 1): runs the standard analysis, publishes the score to the OpenSSF
# API (which drives the README badge) and uploads SARIF to the repo's code-scanning tab. Actions are
# pinned by commit SHA like every other workflow in this repo.

on:
  # Manual re-run from the Actions tab or `gh workflow run scorecard.yml`.
  workflow_dispatch:
  # Re-run when branch-protection settings change, since Scorecard scores them.
  branch_protection_rule:
  schedule:
    - cron: '20 7 * * 1' # weekly, Monday 07:20 UTC
  push:
    branches: [main]

# Least privilege at the top; the analysis job widens only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write # publish_results authenticates to the OpenSSF API via OIDC
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score so https://api.securityscorecards.dev/.../badge resolves.
          publish_results: true
          # Fine-grained PAT (Administration/Contents/Metadata: read) so the Branch-Protection
          # check can actually read the ruleset — the default GITHUB_TOKEN cannot. Stored as the
          # SCORECARD_TOKEN repo secret.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
