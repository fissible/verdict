name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer-install:
    runs-on: ubuntu-latest
    name: Clean Laravel consumer

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl, sodium
          tools: composer:v2
          coverage: none

      - name: Create clean Laravel application
        run: composer create-project laravel/laravel:^12.0 consumer --no-interaction --prefer-dist

      - name: Install Verdict through a Composer path repository
        working-directory: consumer
        run: |
          composer config repositories.verdict path ..
          composer require fissible/verdict:@dev --no-interaction --with-all-dependencies

      - name: Publish and migrate Verdict resources
        working-directory: consumer
        run: |
          php artisan vendor:publish --tag=verdict-config --force
          php artisan vendor:publish --tag=verdict-migrations --force
          php artisan migrate --force
          php artisan help verdict:prune-rate-limits
          php artisan help verdict:execution-claims
          php artisan help verdict:resolve-execution-claim
          php artisan help verdict:evaluation-baseline
          php artisan help verdict:evaluation-compare

  coverage:
    runs-on: ubuntu-latest
    name: Code coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl, sodium
          tools: composer:v2
          coverage: pcov

      - name: Install dependencies
        run: |
          composer require "laravel/framework:12.*" "orchestra/testbench:10.*" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Enforce code coverage
        run: vendor/bin/pest --coverage --min=80 --coverage-html=build/coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-coverage-html
          path: build/coverage
          if-no-files-found: error
          retention-days: 7

  postgres:
    runs-on: ubuntu-latest
    name: PostgreSQL (READ COMMITTED default)

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: verdict
          POSTGRES_USER: verdict
          POSTGRES_PASSWORD: verdict
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verdict -d verdict"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: verdict
      DB_USERNAME: verdict
      DB_PASSWORD: verdict

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, intl, sodium
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:12.*" "orchestra/testbench:10.*" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Test suite against PostgreSQL
        run: vendor/bin/pest

  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.3, 8.4, 8.5]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl, sodium
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: PHPStan
        if: runner.os != 'Windows'
        run: composer analyse

      - name: PHPStan
        if: runner.os == 'Windows'
        # Larastan boots Testbench in each worker. Parallel workers can race while replacing
        # bootstrap/cache/services.php on Windows, where an open file cannot be renamed.
        run: composer analyse:serial

      - name: Linter
        run: composer lint:check

      - name: Type coverage
        if: runner.os != 'Windows'
        env:
          # Pest 4.0.x stores type-analysis results in one shared PHP cache file.
          # Keep this check single-process so a fork cannot read a partial write.
          FORK_MEM_PER_PROC: 1099511627776
        run: composer test:types

      - name: Test suite
        run: vendor/bin/pest
